<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head><body>
<title>ARES Training</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ARES">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout : appli mobile une colonne, barre d'onglets flottante, séance en plein écran */
:root{
  --bg:#000; --surface:rgba(255,255,255,.07); --surface2:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.12); --fg:#F5F5F7; --muted:rgba(235,235,245,.62);
  --accent:#64D2FF; --ink:#001018; --good:#30D158; --warn:#FF9F0A; --danger:#FF453A;
  --sans:'Inter',-apple-system,'SF Pro Text',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);letter-spacing:-.2px;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.glow{position:fixed;inset:0 0 auto;height:420px;background:radial-gradient(80% 60% at 50% 20%,rgba(100,210,255,.14),transparent 70%);pointer-events:none;z-index:0}
main{position:relative;z-index:1}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
h1{font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:0;text-wrap:balance}
.card{background:var(--surface);border:.5px solid var(--line);border-radius:22px;padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);font-size:13px;font-weight:500;color:rgba(235,235,245,.8)}
.btn{height:56px;border-radius:999px;border:0;background:var(--accent);color:var(--ink);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 0 24px rgba(100,210,255,.3)}
.btn.ghost{background:var(--surface2);color:var(--fg);box-shadow:none}
.btn.small{height:44px;font-size:15px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ares{display:flex;gap:12px;align-items:flex-start;background:rgba(100,210,255,.09);border:.5px solid rgba(100,210,255,.3);border-radius:20px;padding:14px 16px}
.ares b{color:var(--accent);font-size:12px;font-weight:700;display:block;margin-bottom:2px}
.ares p{margin:0;font-size:15px;font-weight:500;line-height:1.4}
.dot{width:26px;height:26px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle,var(--accent) 0 30%,rgba(100,210,255,.25) 32% 60%,transparent 62%);box-shadow:0 0 12px rgba(100,210,255,.6);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.core{width:170px;height:170px;display:block;margin:8px auto 0;filter:drop-shadow(0 0 10px rgba(100,210,255,.55))}
.core .spin{transform-origin:100px 100px;transform-box:view-box;animation:spin 36s linear infinite}
.core .rev{animation-duration:16s;animation-direction:reverse}
.core .beat{transform-origin:100px 100px;transform-box:view-box;animation:pulse 3s ease-in-out infinite}
body.talking .core .beat{animation-duration:.6s}
@keyframes spin{to{transform:rotate(360deg)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span:first-child{font-size:12px;color:var(--muted);font-weight:500}
.stat strong{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat small{font-size:12px;color:var(--muted);font-weight:500}
details.list{background:var(--surface);border-radius:22px;overflow:hidden}
details.list summary{list-style:none;min-height:52px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:15px;cursor:pointer}
details.list summary::-webkit-details-marker{display:none}
details.list summary svg{transition:transform .2s}
details.list[open] summary svg{transform:rotate(180deg)}
.li{display:flex;align-items:center;gap:12px;min-height:46px;border-top:.5px solid var(--line);padding:6px 18px}
.li .n{width:22px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.li .t{flex:1;font-size:15px;font-weight:500;min-width:0}
.li .d{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.prog-pick{display:grid;gap:10px}
.prog{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--surface);border:1px solid transparent;text-align:left;width:100%}
.prog.today{border-color:var(--accent);background:rgba(100,210,255,.1)}
.prog .num{width:44px;height:44px;border-radius:14px;background:rgba(100,210,255,.15);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.tabbar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:488px;margin:0 auto;height:64px;border-radius:32px;background:rgba(30,30,32,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:.5px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));z-index:20}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:10px;font-weight:600}
.tabbar a[aria-current="page"]{color:var(--accent)}
/* séance */
.run{position:fixed;inset:0;z-index:30;background:radial-gradient(70% 35% at 50% 32%,rgba(100,210,255,.16),transparent 70%),#000;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.run .inner{max-width:520px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;min-height:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip-btn{height:38px;padding:0 14px;border-radius:999px;border:0;background:var(--surface2);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.ex-head{text-align:center;display:flex;flex-direction:column;gap:2px}
.ex-head .m{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.4px}
.ex-head h2{font-size:24px}
.ringbox{position:relative;width:min(250px,64vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.ringbox img{position:absolute;inset:7%;width:86%;height:86%;object-fit:cover;border-radius:50%;-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 71%);mask-image:radial-gradient(circle,#000 58%,transparent 71%);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) scale(1.015)}}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 7px rgba(100,210,255,.5))}
.clock{text-align:center;display:flex;flex-direction:column;gap:0}
.clock .p{font-size:13px;font-weight:600;color:var(--muted)}
.clock .c{font-size:44px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1.1}
.ctrl{display:flex;justify-content:center;gap:10px}
.ctrl button{height:44px;min-width:68px;padding:0 14px;border-radius:999px;border:0;background:var(--surface2);font-size:15px;font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.set{min-height:52px;padding:4px 8px 4px 14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid transparent;display:flex;align-items:center;gap:6px}
.set.on{border-color:var(--accent);background:rgba(100,210,255,.12)}
.set.done{opacity:.7}
.set .lab{width:64px;font-size:14px;font-weight:700;flex-shrink:0}
.set.on .lab,.set.done .lab{color:var(--accent)}
.step{display:flex;align-items:center;gap:2px;flex:1;justify-content:center;min-width:0}
.step button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.1);font-size:17px;flex-shrink:0}
.step output{min-width:50px;text-align:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.step output small{font-size:11px;font-weight:500;color:var(--muted)}
.tag{font-size:11px;font-weight:700;color:var(--warn);background:rgba(255,159,10,.14);padding:3px 8px;border-radius:999px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sheet .panel{width:100%;max-width:520px;margin:0 auto;max-height:80%;overflow:auto;background:#1c1c1e;border-radius:24px 24px 0 0;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .panel .li{cursor:pointer;border:0;background:none;width:100%;text-align:left;color:var(--fg)}
.sheet .panel .li.cur .t{color:var(--accent)}
.ringsm{width:110px;height:110px;flex-shrink:0}
.glasses{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;flex:1}
.glasses button{height:32px;border-radius:7px;border:0;background:rgba(255,255,255,.1);padding:0}
.glasses button.f{background:var(--accent)}
.seg{display:flex;padding:3px;border-radius:12px;background:rgba(118,118,128,.24)}
.seg button{flex:1;height:38px;border:0;border-radius:9px;background:transparent;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:rgba(99,99,102,.95)}
.chart{width:100%;height:auto;display:block}
.grades{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;text-align:center}
.grades div{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.grades span:first-child{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted)}
.grades .got span:first-child{background:var(--accent);color:var(--ink)}
.grades .next span:first-child{background:none;border:1.5px solid var(--accent);color:var(--fg)}
.grades span:last-child{font-size:10px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;max-width:100%}
input[type=number]{background:var(--surface2);border:0;border-radius:12px;height:44px;padding:0 12px;color:var(--fg);font:600 17px var(--sans);width:110px}
.switch{width:52px;height:32px;border-radius:999px;border:0;background:rgba(120,120,128,.4);position:relative;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"]::after{left:22px}
.hist .li{padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#2c2c2e;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="glow" aria-hidden="true"></div>
<main id="main" class="wrap"></main>
<nav class="tabbar" id="tabbar" aria-label="Navigation">
  <a href="#today" data-tab="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>Aujourd'hui</a>
  <a href="#seance" data-tab="seance"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Séance</a>
  <a href="#progres" data-tab="progres"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19l5-6 4 3 7-9"/></svg>Progrès</a>
  <a href="#nutrition" data-tab="nutrition"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 21c-4 0-7-3-7-7 0-5 7-11 7-11s7 6 7 11c0 4-3 7-7 7z"/></svg>Nutrition</a>
</nav>

<div id="sheet" class="sheet" hidden></div>

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function dkey(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function exOf(id){return EX[id]?Object.assign({id},EX[id]):null}
function progItems(p){return p.items.map(it=>typeof it==="string"?exOf(it):{superset:true,id:"ss:"+it.superset.join("+"),rounds:it.rounds,rest:it.rest,items:it.superset.map(exOf).filter(Boolean)}).filter(Boolean)}
function progById(id){return PROGRAMS.find(p=>p.id===id)}
function todayProgram(){const d=new Date().getDay();return PROGRAMS.find(p=>p.day===d)||null}
function nextProgram(){for(let i=1;i<=7;i++){const d=(new Date().getDay()+i)%7;const p=PROGRAMS.find(x=>x.day===d);if(p)return {p,inDays:i,day:d}}return null}
function estMin(p){let s=0;progItems(p).forEach(e=>{if(e.superset){s+=e.rounds*(e.items.length*45)+(e.rounds-1)*e.rest+90}else if(e.kind==="time"){s+=e.work+60}else{s+=e.sets*45+(e.sets-1)*e.rest+90}});return Math.round(s/60/5)*5}
function fmtDur(min){const h=Math.floor(min/60),m=min%60;return h?(h+" h"+(m?" "+pad(m):"")):(m+" min")}
function curWeight(){const ks=Object.keys(DAYS).filter(k=>DAYS[k]&&DAYS[k].weight).sort();return ks.length?DAYS[ks[ks.length-1]].weight:null}
function gradeIdx(){const t=PROFILE,w=curWeight()||0;let i=0;while(i+1<GRADES.length&&GRADES[i+1].ok(t,w))i++;return i}
function weekSessions(){const now=new Date();const day=(now.getDay()+6)%7;const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-day);const k=dkey(mon);return SESSIONS.filter(s=>s.date>=k).length}
function today(){const k=dkey();return DAYS[k]||{date:k,prot:0,water:0,meal:""}}
function suggestion(e){if(e.kind!=="reps"||e.bw)return null;const l=LAST[e.id];if(!l||!l.sets||!l.sets.length)return null;const allOk=l.sets.length>=e.sets&&l.sets.every(s=>s.reps>=e.reps);if(!allOk)return null;const top=Math.max.apply(null,l.sets.map(s=>s.kg));return {from:top,to:Math.round((top+e.step)*10)/10,reps:e.reps,sets:l.sets.length}}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

function startEars(){if(!SR){toast("La commande vocale n'est pas disponible sur ce navigateur.");return}unlock();listening=true;lsSet("ares-ears",true);spawnEar();if(RUN)renderRun();else render();say("Mode mains libres activé. Dis Arès, puis ta commande.")}

function spawnEar(){
  if(!listening||speaking||rec||!SR)return;
  try{
    rec=new SR();rec.lang="fr-FR";rec.continuous=true;rec.interimResults=false;rec.maxAlternatives=1;
    rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)hear(e.results[i][0].transcript)}};
    rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){listening=false;lsSet("ares-ears",false);toast("Micro refusé. Autorise le micro pour Safari dans Réglages.");if(RUN)renderRun();else render()}};
    rec.onend=()=>{rec=null;if(listening&&!speaking)setTimeout(spawnEar,300)};
    rec.start();
  }catch(e){rec=null;setTimeout(spawnEar,1200)}
}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9' ]/g," ")}
const WAKE=/\b(ares|aress|hares|ares|aris|arres|ar es|a res|arez|arest|harres)\b/;
function hear(raw){
  const t=norm(raw);lastHeard=raw;const ind=document.getElementById("heard");if(ind)ind.textContent="« "+raw.trim()+" »";
  if(!WAKE.test(t))return;
  const c=t.replace(WAKE,"").trim();
  const timing=RUN&&["rest","work","tempo"].includes(RUN.phase);
  if(/(termine|fin) (la |de )?seance|on arrete la seance/.test(c)){if(RUN){say("Séance terminée. J'enregistre.");finish()}return}
  if(/(demarre|lance|commence|go)( la)? seance/.test(c)&&!RUN){const p=todayProgram()||PROGRAMS[0];startRun(p.id);return}
  if(!RUN){say("Aucune séance en cours. Dis : Arès, démarre la séance.");return}
  if(/(ajoute|rajoute|plus|encore) ?(15|quinze)/.test(c)){if(timing){RUN.endAt+=15000;RUN.total+=15;saveRun();updClock();say("Quinze secondes de plus.")}return}
  if(/(enleve|retire|moins) ?(15|quinze)/.test(c)){if(timing){RUN.endAt-=15000;saveRun();updClock();say("Quinze secondes de moins.")}return}
  if(/(reprend|continue|relance|c'est reparti)/.test(c)){if(RUN.paused){RUN.endAt=Date.now()+RUN.rem*1000;RUN.paused=false;saveRun();renderRun();say("On reprend.")}return}
  if(/(stop|pause|arrete|attends)/.test(c)){if(timing&&!RUN.paused){RUN.rem=Math.max(0,Math.ceil((RUN.endAt-Date.now())/1000));RUN.paused=true;saveRun();renderRun();say("Chrono en pause.")}else say("Rien à arrêter.");return}
  if(/(passe|saute|skip).*(repos)|fin du repos/.test(c)){if(RUN.phase==="rest"){RUN.endAt=Date.now()}return}
  if(/repos/.test(c)){const e=curEx();if(!timing){startTimer("rest",(e&&e.rest)||90);say("Repos lancé, "+restSpoken((e&&e.rest)||90)+".")}return}
  if(/(compte|descente|tempo)/.test(c)){const p=curPtr(curEx());if(p&&p.ex.tempo&&!timing)startTempo();return}
  if(/(suivant|exercice d'apres|next|change)/.test(c)){advance();return}
  if(/(valid|c'est fait|serie (faite|finie|terminee)|fini|termine)/.test(c)){if(RUN.phase==="ready")validate();else if(RUN.phase==="next")advance();return}
  if(/(demarre|lance|commence|go|top)/.test(c)){const e=curEx();if(e&&e.kind==="time"&&RUN.phase==="ready")startWork();else say("Vas-y, je compte tes séries.");return}
  if(/(combien|temps|reste)/.test(c)){if(timing)say("Il reste "+restSpoken(RUN.rem)+".");else{const p=curPtr(curEx());say("Série "+(p.set+1)+". "+itemName(curEx())+".")}return}
  if(/(quoi|explique|comment)/.test(c)){const e=curEx();say(e.superset?e.items.map(x=>x.cue).join(" "):e.cue);return}
  say("Pas compris. Dis par exemple : Arès, série validée.");
}

function itemDetail(e){if(e.superset)return e.rounds+" tours";if(e.kind==="time")return Math.round(e.work/60)+" min";const l=LAST[e.id];const kg=l&&l.sets&&l.sets.length?l.sets[l.sets.length-1].kg:e.kg;return e.sets+"×"+(e.max?"max":e.reps)+(e.bw?"":" · "+fmtKg(kg)+" kg")}

function briefing(p){const items=progItems(p);const first=items.find(e=>e.kind!=="time")||items[0];let s=`${greet()}. Programme ${p.num} ce soir : ${p.name.toLowerCase()}. ${items.length} exercices, environ ${fmtDur(estMin(p))}. On attaque par ${first?first.name.toLowerCase():"l'échauffement"}.`;const sg=items.map(e=>e.superset?null:suggestion(e)).find(Boolean);if(sg){const e=items.find(x=>!x.superset&&suggestion(x));s+=` Dernière fois au ${e.name.toLowerCase()} : ${sg.sets} × ${sg.reps} à ${fmtKg(sg.from)} kg. Tu peux tenter ${fmtKg(sg.to)} kg.`}return s}

  ${db?"":`<div class="row"><button class="btn ghost small" data-act="backup">Sauvegarder mes données</button><label class="btn ghost small" for="restoreIn" style="cursor:pointer">Restaurer</label><input id="restoreIn" type="file" accept="application/json,.json" hidden></div>`}</div>

/* ---------- Séance : moteur ---------- */
function runProg(){return RUN&&progById(RUN.pid)}
function runItems(){const p=runProg();return p?progItems(p):[]}
function mkSets(e,n){const l=LAST[e.id];const lastKg=l&&l.sets&&l.sets.length?l.sets[l.sets.length-1].kg:null;return Array.from({length:n},(_,j)=>({reps:e.max?(PROFILE.pushups||e.reps):e.reps,kg:lastKg!=null?((l.sets[j]&&l.sets[j].kg!=null)?l.sets[j].kg:lastKg):e.kg,done:false}))}
function startRun(pid){
  unlock();const p=progById(pid);if(!p)return;
  const vals={};progItems(p).forEach(e=>{if(e.superset)e.items.forEach(x=>{vals[x.id]=mkSets(x,e.rounds)});else vals[e.id]=mkSets(e,e.kind==="time"?1:e.sets)});
  RUN={pid,i:0,phase:"ready",endAt:0,total:0,rem:0,paused:false,startedAt:Date.now(),vals,tip:{}};
  saveRun();keepAwake();renderRun();
  const e=runItems()[0];say(`Programme ${p.num}. ${p.name}. Premier exercice : ${itemName(e)}. ${e.cue||""}`);
}
function saveRun(){lsSet("ares-run",RUN)}
function curEx(){return runItems()[RUN.i]}
function curPtr(e){ // renvoie {ex, set, item}
  if(!e)return null;
  if(e.superset){for(let r=0;r<e.rounds;r++)for(let k=0;k<e.items.length;k++){if(!RUN.vals[e.items[k].id][r].done)return {ex:e.items[k],set:r,item:k}}return {ex:e.items[e.items.length-1],set:e.rounds-1,item:e.items.length-1,finished:true}}
  const v=RUN.vals[e.id];const s=v.findIndex(x=>!x.done);return s<0?{ex:e,set:v.length-1,finished:true}:{ex:e,set:s}
}
function startTimer(phase,secs){RUN.phase=phase;RUN.total=secs;RUN.rem=secs;RUN.endAt=Date.now()+secs*1000;RUN.paused=false;RUN.warned=false;RUN.lastSpoken=null;saveRun();renderRun()}
function validate(){
  unlock();const e=curEx(),ptr=curPtr(e);if(!ptr||ptr.finished){advance();return}
  RUN.vals[ptr.ex.id][ptr.set].done=true;beep(990,.12);
  if(ptr.ex.max&&RUN.vals[ptr.ex.id][ptr.set].reps>PROFILE.pushups){PROFILE.pushups=RUN.vals[ptr.ex.id][ptr.set].reps;saveProfile();toast("Nouveau record : "+PROFILE.pushups+" pompes !");say("Nouveau record. "+PROFILE.pushups+" pompes.")}
  const n=curPtr(e);
  if(n.finished){saveRun();exerciseDone();return}
  if(e.superset&&ptr.item<e.items.length-1){RUN.phase="ready";saveRun();renderRun();say(`Enchaîne : ${n.ex.name}.`);return}
  const rest=e.superset?e.rest:e.rest;
  if(rest>0){startTimer("rest",rest);say(`Série validée. Repos, ${restSpoken(rest)}.`)}else{RUN.phase="ready";saveRun();renderRun()}
}
function restSpoken(s){return s>=60?(Math.floor(s/60)+" minute"+(s>=120?"s":"")+(s%60?" "+(s%60):"")):(s+" secondes")}
function exerciseDone(){const items=runItems();if(RUN.i>=items.length-1){finish();return}RUN.phase="next";saveRun();renderRun();const nx=items[RUN.i+1];say(`Exercice terminé. Suivant : ${itemName(nx)}.`)}
function advance(){const items=runItems();if(RUN.i>=items.length-1){finish();return}RUN.i++;RUN.phase="ready";saveRun();renderRun();const e=curEx();say(`${itemName(e)}. ${e.superset?e.items.map(x=>x.name).join(", puis ")+". "+e.rounds+" tours.":e.cue||""}`)}
function jump(i){RUN.i=i;RUN.phase="ready";saveRun();closeSheet();renderRun();const e=curEx();say(itemName(e))}
function startWork(){const e=curEx();unlock();startTimer("work",e.work);say(`C'est parti. ${Math.round(e.work/60)} minutes. ${e.info||""}`)}
function startTempo(){const ptr=curPtr(curEx());unlock();startTimer("tempo",ptr.ex.tempo||5);say("Descends.",false)}
function finish(){
  const p=runProg(),items=runItems(),out=[];let count=0;const date=dkey();
  items.forEach(e=>{(e.superset?e.items:[e]).forEach(x=>{const done=(RUN.vals[x.id]||[]).filter(s=>s.done).map(s=>({reps:s.reps,kg:s.kg}));if(done.length){out.push({id:x.id,name:x.name,sets:done});count+=done.length;if(x.kind==="reps")LAST[x.id]={date,sets:done}}})});
  const s={id:"s"+Date.now().toString(36),date,ts:Date.now(),pid:p.id,pnum:p.num,pname:p.name,dur:Math.round((Date.now()-RUN.startedAt)/1000),count,items:out};
  if(count){SESSIONS.unshift(s);saveSession(s);saveLast()}
  SUMMARY={date,count,dur:s.dur,pnum:p.num};RUN=null;lsSet("ares-run",null);
  try{wake&&wake.release()}catch(e){}
  document.getElementById("run").hidden=true;
  if(listening)stopEars(true);
  say(`Mission accomplie. ${count} séries en ${Math.round(s.dur/60)} minutes. Beau travail${PROFILE.name?" "+PROFILE.name:""}.`);
  location.hash="#today";render();toast("Séance enregistrée");
}
function quit(){if(listening)stopEars(true);RUN=null;lsSet("ares-run",null);document.getElementById("run").hidden=true;closeSheet();render()}

setInterval(()=>{
  if(!RUN||!["rest","work","tempo"].includes(RUN.phase)||RUN.paused)return;
  const rem=Math.max(0,Math.ceil((RUN.endAt-Date.now())/1000));
  if(rem!==RUN.rem){RUN.rem=rem;updClock();
    if(RUN.phase==="rest"){if(rem===10&&RUN.total>20)say("Dix secondes.");if(rem<=3&&rem>0)beep(660,.08)}
    if(RUN.phase==="tempo"&&rem>0)say(String(rem));
    if(RUN.phase==="work"&&rem===60&&RUN.total>120)say("Encore une minute.")}
  if(rem<=0){
    if(RUN.phase==="rest"){beep(990,.3);RUN.phase="ready";saveRun();renderRun();const ptr=curPtr(curEx());say(`C'est reparti. ${curEx().superset?"Tour "+(ptr.set+1)+". "+ptr.ex.name:"Série "+(ptr.set+1)}.`)}
    else if(RUN.phase==="work"){beep(990,.3);const e=curEx();RUN.vals[e.id][0].done=true;saveRun();exerciseDone()}
    else if(RUN.phase==="tempo"){beep(990,.2);RUN.phase="ready";saveRun();renderRun();say("Remonte, et recommence.")}
  }
},250);
function updClock(){const c=document.getElementById("clk");if(c)c.textContent=mmss(RUN.rem);const r=document.getElementById("prog");if(r&&RUN.total){r.setAttribute("stroke-dashoffset",(RC*(1-RUN.rem/RUN.total)).toFixed(1))}}
const RC=2*Math.PI*96;

function setRow(x,s,j,on,label){const kgStep=x.step||1;return `<div class="set${on?" on":""}${s.done?" done":""}"><span class="lab">${s.done?label+" ✓":label}</span>
  <div class="step"><button data-act="adj" data-id="${x.id}" data-j="${j}" data-f="reps" data-d="-1" aria-label="Moins une répétition">−</button><output>${s.reps}<small> ${x.max?"max":"reps"}</small></output><button data-act="adj" data-id="${x.id}" data-j="${j}" data-f="reps" data-d="1" aria-label="Plus une répétition">+</button></div>
  ${x.bw?`<div class="step"><output class="muted" style="font-size:13px">Poids du corps</output></div>`:`<div class="step"><button data-act="adj" data-id="${x.id}" data-j="${j}" data-f="kg" data-d="${-kgStep}" aria-label="Moins ${fmtKg(kgStep)} kg">−</button><output>${fmtKg(s.kg)}<small> kg</small></output><button data-act="adj" data-id="${x.id}" data-j="${j}" data-f="kg" data-d="${kgStep}" aria-label="Plus ${fmtKg(kgStep)} kg">+</button></div>`}</div>`}
function renderRun(){
  const box=document.getElementById("run");if(!RUN){box.hidden=true;return}
  const items=runItems(),e=items[RUN.i];if(!e){quit();return}
  const ptr=curPtr(e),x=ptr.ex,p=runProg();
  const timing=["rest","work","tempo"].includes(RUN.phase);
  const doneSets=(e.superset?e.items:[e]).reduce((a,y)=>a+RUN.vals[y.id].filter(s=>s.done).length,0),totSets=(e.superset?e.items:[e]).reduce((a,y)=>a+RUN.vals[y.id].length,0);
  const frac=timing?RUN.rem/RUN.total:doneSets/totSets;
  let phase,clock;
  if(RUN.phase==="rest"){phase="Repos · puis "+(e.superset?"tour "+(ptr.set+1):"série "+(ptr.set+1));clock=mmss(RUN.rem)}
  else if(RUN.phase==="work"){phase=e.info||"En cours";clock=mmss(RUN.rem)}
  else if(RUN.phase==="tempo"){phase="Descente lente";clock=mmss(RUN.rem)}
  else if(RUN.phase==="next"||ptr.finished){phase="Exercice terminé";clock="✓"}
  else if(e.kind==="time"){phase=e.info||"";clock=mmss(e.work)}
  else{phase=(e.superset?"Tour "+(ptr.set+1)+" sur "+e.rounds+" · "+x.name:"Série "+(ptr.set+1)+" sur "+RUN.vals[x.id].length);const v=RUN.vals[x.id][ptr.set];clock=v.reps+(x.max?" max":" reps")+(x.bw?"":" · "+fmtKg(v.kg)+" kg")}
  const sg=!e.superset&&!RUN.tip[e.id]?suggestion(e):null;
  let rows="";
  if(e.superset){for(let r=0;r<e.rounds;r++){rows+=`<div class="small muted" style="margin-top:${r?6:0}px;font-weight:600">Tour ${r+1}</div>`;e.items.forEach((y,k)=>{rows+=setRow(y,RUN.vals[y.id][r],r,!ptr.finished&&ptr.set===r&&ptr.item===k,y.name.split(" ")[0])})}}
  else if(e.kind!=="time"){rows=RUN.vals[e.id].map((s,j)=>setRow(e,s,j,!ptr.finished&&ptr.set===j,"Série "+(j+1))).join("")}
  let main;
  if(RUN.phase==="next"||ptr.finished)main=`<button class="btn" data-act="advance">Exercice suivant</button>`;
  else if(RUN.phase==="rest")main=`<button class="btn ghost" data-act="skip">Passer le repos</button>`;
  else if(RUN.phase==="work")main=`<button class="btn ghost" data-act="endwork">Terminer maintenant</button>`;
  else if(e.kind==="time")main=`<button class="btn" data-act="work">Démarrer ${Math.round(e.work/60)} min</button>`;
  else main=`<button class="btn" data-act="validate">${e.superset?x.name.split(" ")[0]+" validé":"Série "+(ptr.set+1)+" validée"}</button>`;
  box.innerHTML=`<div class="inner">
  <div class="topbar"><button class="chip-btn" data-act="list" aria-haspopup="dialog">${CHEV}<span>${RUN.i+1} / ${items.length}</span></button>
  <button class="chip-btn" data-act="ears" aria-pressed="${listening?"true":"false"}" style="${listening?"background:rgba(255,69,58,.18);color:#FF6961":""}"><svg width="14" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>${listening?"Écoute":"Mains libres"}</button>
  <button class="chip-btn" data-act="quitask" aria-label="Quitter la séance">Quitter</button></div>
  ${listening?`<div class="row small" style="justify-content:center;gap:8px;color:var(--muted)"><span style="width:8px;height:8px;border-radius:50%;background:#FF453A;animation:pulse 1.2s infinite"></span><span>ARES écoute · dis « Arès, … »</span><span id="heard" class="mono" style="max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${lastHeard?esc("« "+lastHeard.trim()+" »"):""}</span></div>`:""}
  <div class="ex-head"><span class="m">${esc(x.m||"")}${e.superset?" · super-série":""}</span><h2>${esc(x.name)}</h2>${x.guess&&!LAST[x.id]?`<span style="align-self:center;margin-top:4px" class="tag">Charge de départ à ajuster</span>`:""}</div>
  <div class="ringbox"><img src="${IMG[x.img]||""}" alt="${esc(x.name)}"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="96" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/><circle id="prog" cx="100" cy="100" r="96" fill="none" stroke="#64D2FF" stroke-width="5" stroke-linecap="round" stroke-dasharray="${RC.toFixed(1)}" stroke-dashoffset="${(RC*(1-Math.max(0,Math.min(1,frac)))).toFixed(1)}" transform="rotate(-90 100 100)"/></svg></div>
  <div class="clock"><span class="p">${esc(phase)}</span><span class="c" id="clk">${esc(clock)}</span></div>
  ${timing?`<div class="ctrl"><button data-act="add" data-d="-15">−15 s</button><button data-act="pause" aria-label="${RUN.paused?"Reprendre":"Pause"}">${RUN.paused?"▶":"❚❚"}</button><button data-act="add" data-d="15">+15 s</button></div>`:""}
  ${!timing&&x.tempo&&!ptr.finished&&RUN.phase!=="next"?`<div class="ctrl"><button data-act="tempo">Compter ma descente · ${x.tempo} s</button></div>`:""}
  ${sg?`<div class="ares" style="align-items:center"><span class="dot" aria-hidden="true"></span><div style="flex:1"><b>ARES</b><p style="font-size:14px">${sg.sets} × ${sg.reps} réussis la dernière fois à ${fmtKg(sg.from)} kg. On passe à ${fmtKg(sg.to)} kg ?</p></div><button class="btn small" style="width:auto;padding:0 14px" data-act="applytip">${fmtKg(sg.to)} kg</button></div>`:`<div class="ares"><span class="dot" aria-hidden="true"></span><div><b>ARES</b><p style="font-size:14px">${esc(e.superset?e.items.map(y=>y.name).join(" puis ")+", sans pause entre les deux. Repos "+e.rest+" s après chaque tour.":x.cue)}</p></div></div>`}
  ${rows?`<div class="sets">${rows}</div>`:""}
  <div style="flex:1"></div>
  ${main}
  <button class="small muted" data-act="voice" style="background:none;border:0;padding:6px;align-self:center">${PROFILE.voice?"Couper la voix d'ARES":"Activer la voix d'ARES"}</button>
  </div>`;
  box.hidden=false;
}
function openList(){const items=runItems();const sh=document.getElementById("sheet");sh.innerHTML=`<div class="panel" role="dialog" aria-label="Exercices de la séance"><div style="padding:0 18px 8px" class="between"><h2>Programme ${runProg().num}</h2><button class="chip-btn" data-act="close">Fermer</button></div>${items.map((e,i)=>{const all=(e.superset?e.items:[e]).every(y=>RUN.vals[y.id].every(s=>s.done));return `<button class="li${i===RUN.i?" cur":""}" data-act="jump" data-i="${i}"><span class="n">${all?"✓":pad(i+1)}</span><span class="t">${esc(itemName(e))}</span><span class="d">${esc(itemDetail(e))}</span></button>`}).join("")}</div>`;sh.hidden=false}
function closeSheet(){const sh=document.getElementById("sheet");sh.hidden=true;sh.innerHTML=""}
function askQuit(){const sh=document.getElementById("sheet");sh.innerHTML=`<div class="panel" role="dialog" aria-label="Quitter la séance"><div style="padding:4px 18px 8px" class="stack"><h2>Quitter la séance ?</h2><p class="muted" style="margin:0">Tu peux enregistrer ce que tu as déjà fait, ou tout abandonner.</p><button class="btn" data-act="finish">Enregistrer et terminer</button><button class="btn ghost" data-act="abandon">Abandonner sans enregistrer</button><button class="btn ghost" data-act="close">Continuer la séance</button></div></div>`;sh.hidden=false}

/* ---------- Routage et événements ---------- */
const VIEWS={today:viewToday,seance:viewSeance,progres:viewProgres,nutrition:viewNutrition};
function route(){const h=(location.hash||"#today").slice(1);return VIEWS[h]?h:"today"}
function render(){const v=route();document.getElementById("main").innerHTML=VIEWS[v]();document.querySelectorAll(".tabbar a").forEach(a=>{if(a.dataset.tab===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")})}
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(a==="close"){if(ev.target===el||el.tagName==="BUTTON")closeSheet();return}
  switch(a){
    case "start":if(RUN){renderRun();break}startRun(el.dataset.pid);break;
    case "resume":unlock();keepAwake();renderRun();break;
    case "pick":PICK=el.dataset.pid;render();break;
    case "validate":validate();break;
    case "advance":advance();break;
    case "skip":RUN.endAt=Date.now();break;
    case "endwork":RUN.endAt=Date.now();break;
    case "work":startWork();break;
    case "tempo":startTempo();break;
    case "add":{const d=+el.dataset.d;if(RUN.paused){RUN.rem=Math.max(1,RUN.rem+d)}else{RUN.endAt+=d*1000}RUN.total=Math.max(RUN.total+(d>0?d:0),1);RUN.rem=RUN.paused?RUN.rem:Math.max(0,Math.ceil((RUN.endAt-Date.now())/1000));saveRun();updClock();break}
    case "pause":if(RUN.paused){RUN.endAt=Date.now()+RUN.rem*1000;RUN.paused=false}else{RUN.rem=Math.max(0,Math.ceil((RUN.endAt-Date.now())/1000));RUN.paused=true}saveRun();renderRun();break;
    case "adj":{const v=RUN.vals[el.dataset.id];const j=+el.dataset.j,f=el.dataset.f,d=+el.dataset.d;v[j][f]=Math.max(0,Math.round((v[j][f]+d)*10)/10);if(f==="kg")for(let k=j+1;k<v.length;k++){if(!v[k].done)v[k].kg=v[j].kg}saveRun();renderRun();break}
    case "applytip":{const e=curEx(),sg=suggestion(e);if(sg){RUN.vals[e.id].forEach(s=>{if(!s.done)s.kg=sg.to})}RUN.tip[e.id]=1;saveRun();renderRun();say(`Va pour ${fmtKg(sg?sg.to:0)} kilos.`);break}
    case "list":openList();break;
    case "ears":if(listening)stopEars();else startEars();break;
    case "backup":{try{const blob=new Blob([JSON.stringify({v:1,PROFILE,LAST,DAYS,SESSIONS},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ares-sauvegarde-"+dkey()+".json";document.body.appendChild(a);a.click();a.remove();toast("Sauvegarde créée")}catch(e){toast("Sauvegarde impossible ici")}break}
    case "jump":jump(+el.dataset.i);break;
    case "quitask":askQuit();break;
    case "finish":closeSheet();finish();break;
    case "abandon":quit();break;
    case "voice":PROFILE.voice=!PROFILE.voice;saveProfile();if(RUN)renderRun();else render();if(PROFILE.voice)say("Voix activée.");break;
    case "test":{const k=el.dataset.k;PROFILE[k]=Math.max(0,(PROFILE[k]||0)+(+el.dataset.d));const before=GRADES[gradeIdx()].n;saveProfile();render();break}
    case "prot":{const k=dkey();DAYS[k]=Object.assign(today(),DAYS[k]||{});DAYS[k].prot=Math.max(0,(DAYS[k].prot||0)+(+el.dataset.d));saveDay(k);render();break}
    case "water":{const k=dkey();DAYS[k]=Object.assign(today(),DAYS[k]||{});const n=+el.dataset.n;DAYS[k].water=(DAYS[k].water===n&&n>0)?n-1:n;saveDay(k);render();break}
    case "meal":{const k=dkey();DAYS[k]=Object.assign(today(),DAYS[k]||{});DAYS[k].meal=el.dataset.v;saveDay(k);render();break}
  }
});
document.getElementById("sheet").addEventListener("click",ev=>{if(ev.target.id==="sheet")closeSheet()});
document.addEventListener("submit",ev=>{const f=ev.target;if(f.dataset.form==="weight"){ev.preventDefault();const inp=document.getElementById("wIn");const v=parseFloat(String(inp.value).replace(",","."));if(!(v>30&&v<250)){toast("Entre un poids en kg, par exemple 83,3");return}const k=dkey();DAYS[k]=Object.assign(today(),DAYS[k]||{});DAYS[k].weight=Math.round(v*10)/10;saveDay(k);inp.value="";render();toast("Pesée enregistrée : "+fmtKg(DAYS[k].weight)+" kg")}});
document.addEventListener("change",ev=>{if(ev.target.id==="restoreIn"){const file=ev.target.files&&ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.PROFILE)PROFILE=Object.assign({},DEF_PROFILE,d.PROFILE);LAST=d.LAST||LAST;DAYS=d.DAYS||DAYS;SESSIONS=d.SESSIONS||SESSIONS;cacheAll();render();toast("Données restaurées")}catch(e){toast("Fichier de sauvegarde illisible")}};r.readAsText(file);return}
const f=ev.target.dataset&&ev.target.dataset.field;if(!f)return;if(f==="name")PROFILE.name=ev.target.value.trim().slice(0,30);if(f==="protTarget"){const v=parseInt(ev.target.value,10);if(v>=40&&v<=300)PROFILE.protTarget=v}saveProfile();render()});

render();if(RUN)renderRun();
initDb();
})();
</script>

</body></html>
